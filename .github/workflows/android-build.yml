name: ReelTara Android QA and bundles
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install web dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Install Capacitor 8
        run: npm install --no-save --package-lock=false @capacitor/core@8.0.0 @capacitor/android@8.0.0 @capacitor/cli@8.0.0 @capacitor/assets@3.0.5
      - name: Build web app
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.REELTARA_API_ORIGIN }}
      - name: Validate backend origin
        env:
          API_ORIGIN: ${{ vars.REELTARA_API_ORIGIN }}
        run: |
          if [ -z "$API_ORIGIN" ]; then
            echo "::warning::REELTARA_API_ORIGIN is unset. Android online film features need a deployed HTTPS backend."
          elif ! [[ "$API_ORIGIN" =~ ^https://[a-zA-Z0-9.-]+$ ]]; then
            echo "::error::REELTARA_API_ORIGIN must be an HTTPS origin without slash or path."
            exit 1
          fi
      - name: Generate Android native platform
        run: |
          npx cap add android
          npx cap sync android
          grep -Eq 'targetSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode $GITHUB_RUN_NUMBER/" android/app/build.gradle
      - name: Prepare ReelTara branded Android icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/generate_android_assets.py
          npx capacitor-assets generate --android --iconBackgroundColor "#0B1020" --splashBackgroundColor "#0B1020"
      - name: Build debug APK
        run: cd android && bash ./gradlew --no-daemon assembleDebug
      - name: Build signed release AAB when keys exist
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::notice::No upload key secrets; signed AAB skipped."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          chmod 600 android/upload-keystore.jks
          export ANDROID_UPLOAD_KEYSTORE_PATH="$PWD/android/upload-keystore.jks"
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  uploadRelease {
                      storeFile file(System.getenv("ANDROID_UPLOAD_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.uploadRelease }
              }
          }
          GRADLE
          (cd android && bash ./gradlew --no-daemon bundleRelease)
          rm -f android/upload-keystore.jks
      - uses: actions/upload-artifact@v4
        with:
          name: reeltara-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: reeltara-signed-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: ignore
          retention-days: 14
