name: ReelTara Android QA and bundles
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install web dependencies
        run: npm ci
      - name: Run regression tests
        run: npm test
      - name: Build web app
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.REELTARA_API_ORIGIN || 'https://reel-tara.vercel.app' }}
      - name: Validate backend origin
        env:
          API_ORIGIN: ${{ vars.REELTARA_API_ORIGIN || 'https://reel-tara.vercel.app' }}
        run: |
          if [ -z "$API_ORIGIN" ]; then
            echo "::warning::REELTARA_API_ORIGIN is unset. Android online film features need a deployed HTTPS backend."
          elif ! [[ "$API_ORIGIN" =~ ^https://[a-zA-Z0-9.-]+$ ]]; then
            echo "::error::REELTARA_API_ORIGIN must be an HTTPS origin without slash or path."
            exit 1
          fi
      - name: Verify ReelTara Vercel API (advisory)
        env:
          API_ORIGIN: ${{ vars.REELTARA_API_ORIGIN || 'https://reel-tara.vercel.app' }}
        run: |
          check() {
            local name="$1" endpoint="$2" status
            status="$(curl --silent --show-error --location --max-time 20 -o /dev/null -w '%{http_code}' "${API_ORIGIN}${endpoint}" || true)"
            if [[ "$status" == "200" ]]; then
              echo "${name} status: 200"
            else
              echo "::warning::${name}: HTTP ${status}. Verify Vercel API and server-only TMDB_READ_ACCESS_TOKEN."
            fi
          }
          check "Free catalog" "/api/free-catalog?version=2"
          check "Movie discovery VN" "/api/tmdb?path=movie/popular&region=VN"
      - name: Generate Android native platform
        run: |
          npx cap add android
          npx cap sync android
          grep -Eq 'targetSdkVersion[[:space:]]*=[[:space:]]*36' android/variables.gradle
          node scripts/prepare-android.mjs
      - name: Prepare ReelTara branded Android icon
        run: |
          python3 -m pip install --quiet Pillow
          python3 scripts/generate_android_assets.py
          npx capacitor-assets generate --android --iconBackgroundColor "#0B1020" --splashBackgroundColor "#0B1020"
      - name: Generate Google Play listing graphics
        run: python3 scripts/generate_store_assets.py
      - name: Build debug APK
        run: cd android && bash ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Validate release bundle compilation (unsigned)
        run: |
          cd android
          bash ./gradlew --no-daemon bundleRelease
          # Unsigned output is deliberately deleted so it cannot be misidentified as Play-ready.
          rm -f app/build/outputs/bundle/release/*.aab
      - name: Build signed release AAB when keys exist
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "::notice::No upload key secrets; signed AAB skipped."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          chmod 600 android/upload-keystore.jks
          trap 'rm -f android/upload-keystore.jks' EXIT
          export ANDROID_UPLOAD_KEYSTORE_PATH="$PWD/android/upload-keystore.jks"
          cat >> android/app/build.gradle <<'GRADLE'
          android {
              signingConfigs {
                  uploadRelease {
                      storeFile file(System.getenv("ANDROID_UPLOAD_KEYSTORE_PATH"))
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release { signingConfig signingConfigs.uploadRelease }
              }
          }
          GRADLE
          (cd android && bash ./gradlew --no-daemon bundleRelease)
          test -s android/app/build/outputs/bundle/release/app-release.aab
          curl --fail --location --silent --show-error https://github.com/google/bundletool/releases/download/1.18.3/bundletool-all-1.18.3.jar -o /tmp/reeltara-bundletool.jar
          echo 'a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29  /tmp/reeltara-bundletool.jar' | sha256sum --check
          BUNDLETOOL_JAR=/tmp/reeltara-bundletool.jar node scripts/verify-aab.mjs android/app/build/outputs/bundle/release/app-release.aab
          echo "SIGNED_AAB_AVAILABLE=true" >> "$GITHUB_ENV"
          rm -f android/upload-keystore.jks
      - uses: actions/upload-artifact@v4
        with:
          name: reeltara-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: env.SIGNED_AAB_AVAILABLE == 'true'
        with:
          name: reeltara-signed-release-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14
      - name: Upload store listing graphics
        uses: actions/upload-artifact@v4
        with:
          name: reeltara-play-store-assets
          path: play-store-assets/*.png
          if-no-files-found: error
          retention-days: 30
      - name: Upload signed bundle verification
        if: env.SIGNED_AAB_AVAILABLE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: reeltara-aab-verification
          path: release-evidence/aab-verification.json
          if-no-files-found: error
          retention-days: 30
