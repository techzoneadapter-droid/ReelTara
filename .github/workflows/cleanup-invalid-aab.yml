name: Remove incorrectly labeled unsigned AAB artifacts
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-invalid-aab.yml
permissions:
  contents: read
  actions: write
jobs:
  cleanup:
    if: github.repository == 'techzoneadapter-droid/ReelTara'
    runs-on: ubuntu-latest
    steps:
      - name: Delete only verified unsigned artifacts from older workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for id in 12234462576 12234313960 12234508359; do
            url="/repos/$GITHUB_REPOSITORY/actions/artifacts/$id"
            artifact_name="$(gh api "$url" --jq ".name" 2>/dev/null || true)"
            if [[ "$artifact_name" == "reeltara-signed-release-aab" ]]; then
              gh api --method DELETE "$url" >/dev/null
              echo "Removed previously mislabeled unsigned artifact $id"
            else
              echo "Skipping artifact $id (not present or not matching)"
            fi
          done
